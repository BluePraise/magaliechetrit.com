local_backend: true
backend:
  name: git-gateway
  branch: main
publish_mode: editorial_workflow
media_folder: "images/uploads"
collections:
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Blog" # Used in the UI
    folder: "/src/blog" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: "Layout", name: "layout", widget: "hidden", default: "blog" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: 'Description', name: 'description', widget: 'text', required: false }
      - { label: "Publish Date", name: "dateCreated", widget: "datetime" }
      - { label: "Last Modified", name: "updated_at", widget: "datetime", default: "{{now}}", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Series Name", name: "series", widget: "string", required: false}
      - { label: "Series Number", name: "seriesNumber", widget: "number", required: false }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }